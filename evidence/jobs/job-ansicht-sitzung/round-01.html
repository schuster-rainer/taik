    const secondsText = value => value >= 10 ? `${Math.round(value)} s` : `${value.toFixed(1).replace('.', ',')} s`;
    const tokenLine = flow => [
      `${tokenCount(flow.input)} → ${tokenCount(flow.output)} Tokens`,
      secondsText(flow.seconds),
      money(flow.cost),
    ].filter(Boolean).join(' · ');

    // Line diff of two texts as hunks with two lines of context. Computed here, without any model.
    function diffLines(before, after) {
      const a = before.split('\n'), b = after.split('\n');
      let start = 0;
      while (start < a.length && start < b.length && a[start] === b[start]) start += 1;
      let endA = a.length, endB = b.length;
      while (endA > start && endB > start && a[endA - 1] === b[endB - 1]) { endA -= 1; endB -= 1; }
      const x = a.slice(start, endA), y = b.slice(start, endB);
      let ops = [];
      if (x.length * y.length > 4000000) {
        ops = [...x.map(line => ['-', line]), ...y.map(line => ['+', line])];
      } else {
        const width = y.length + 1, table = new Uint32Array((x.length + 1) * width);
        for (let i = x.length - 1; i >= 0; i -= 1) for (let j = y.length - 1; j >= 0; j -= 1) {
          table[i * width + j] = x[i] === y[j] ? table[(i + 1) * width + j + 1] + 1
            : Math.max(table[(i + 1) * width + j], table[i * width + j + 1]);
        }
        let i = 0, j = 0;
        while (i < x.length && j < y.length) {
          if (x[i] === y[j]) { ops.push([' ', x[i]]); i += 1; j += 1; }
          else if (table[(i + 1) * width + j] >= table[i * width + j + 1]) { ops.push(['-', x[i]]); i += 1; }
          else { ops.push(['+', y[j]]); j += 1; }
        }
        while (i < x.length) { ops.push(['-', x[i]]); i += 1; }
        while (j < y.length) { ops.push(['+', y[j]]); j += 1; }
      }
      const all = [...a.slice(Math.max(0, start - 2), start).map(line => [' ', line]), ...ops,
        ...b.slice(endB, endB + 2).map(line => [' ', line])];
      const keep = all.map((op, index) => all.slice(Math.max(0, index - 2), index + 3).some(near => near[0] !== ' '));
      let markup = '', gap = false;
      all.forEach(([kind, line], index) => {
        if (!keep[index]) { gap = true; return; }
        if (gap && markup) markup += '<span class="diff-gap">···</span>\n';
        gap = false;
        markup += `<span class="diff-${kind === '+' ? 'add' : kind === '-' ? 'del' : 'same'}">${kind} ${escape(line)}</span>\n`;
      });
      return { markup, added: ops.filter(op => op[0] === '+').length, removed: ops.filter(op => op[0] === '-').length };
    }

    function escape(text) {
      return String(text ?? '').replace(/[&<>"']/g, character => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[character]);
    }

    function order(text) {
      if (!text) return [];
      const name = text.replace(/^Some\("(.*)"\)$/, '$1');
      return (Object.hasOwn(aliases, name) ? aliases[name] : name).split(',').map(value => value.trim()).filter(Boolean);
    }

    function latestAccepted(job) {
      return [...job.rounds].reverse().find(round => round.fields.decision === 'accepted') ?? job.baseline;
    }

    function isPending(job) {
      if (job.baseline.fields.kind === 'software') return job.sourceActive || job.sourceQueued;
      return !job.rounds.length || (job.rounds.length < 20 && job.rounds.at(-1).fields.advance === 'true');
    }

    function jobStatus(job) {
      if (job.baseline.fields.kind === 'software' && job.sourceActive) return 'Code-Worker aktiv';
      if (job.sourceQueued && job.rounds.length) return 'Überarbeitung vorgesehen';
      if (job.rounds.at(-1)?.fields.decision === 'rejected') return 'Kandidat abgelehnt';
      if (isPending(job)) return job.rounds.length ? 'Nächste Runde ausstehend' : 'Eingereiht';
      return job.rounds.at(-1)?.fields.advance === 'true' ? 'Rundenlimit erreicht' : 'Abgeschlossen';
    }

    /*BOARD_BEGIN*/
    // An exhausted round limit is marked on the ticket, never left silent.
    function limitReached(job) {
      const last = job.rounds.at(-1);
      return !!last && last.fields.advance === 'true' && last.fields.decision !== 'accepted';
    }

    // Sorts every waiting, running and decided thing into one ticket. A job is in exactly one column:
    // the first row that matches, top to bottom.
    // A brief may start with a Markdown heading. A title is plain text.
    function ticketTitle(text) {
      return String(text ?? '').replace(/^\s*#+\s*/, '').trim();
    }

    // The group that is shown: the user's choice, otherwise the first group that holds something.
    function boardTab(columns, chosen) {
      const names = ['open', 'run', 'decision'];
      if (names.includes(chosen)) return chosen;
      return names.find(name => columns[name].length) ?? 'open';
    }

    function boardTickets(data) {
      const open = [], run = [], decision = [];
      const title = job => ticketTitle(job.goal) || job.id;
      for (const proposal of data.proposals ?? []) {
        // A request of the user that has no proposal yet, or never got one.
        if (proposal.state) {
          const entry = { key: 'proposal:' + proposal.name, proposal: proposal.name, title: ticketTitle(proposal.intent) || proposal.name };
          if (proposal.state === 'deriving') run.push({ ...entry, flag: 'Wird abgeleitet', column: 'run', meta: 'die Factory schreibt Auftrag und Gate' });
          else decision.push({ ...entry, flag: proposal.state === 'failed' ? 'Fehler' : 'Abgelehnt', column: 'decision', meta: proposal.note || 'ohne Begründung' });
          continue;
        }
        open.push({ key: 'proposal:' + proposal.name, proposal: proposal.name, job: proposal.origin, title: ticketTitle(proposal.intent) || proposal.name,
          flag: 'Entscheidung', column: 'open', meta: proposal.origin ? 'aus ' + proposal.origin.replace(/^job-/, '') : 'ohne Herkunft' });
      }
      for (const job of data.jobs) {
        const last = job.rounds.at(-1);
        const id = job.id.replace(/^job-/, '');
        const cost = (job.agent ? ' · @' + job.agent : '') + (job.cost > 0 ? ' · ' + job.cost.toFixed(3).replace('.', ',') + ' $' : '');
        const rounds = job.rounds.length ? ` · ${job.rounds.length} ${job.rounds.length === 1 ? 'Runde' : 'Runden'}` : '';
        const said = job.messages?.at(-1);
        if (job.sourceActive) {
          run.push({ key: job.id, job: job.id, title: title(job), flag: 'In Arbeit', column: 'run', meta: id + ' · Runde ' + (job.rounds.length + 1) + cost });
        } else if (said?.author === 'agent') {
          open.push({ key: job.id, job: job.id, title: title(job), flag: 'Frage', column: 'open', meta: id + ' · fragt nach' + cost });
        } else if (said?.author === 'user' && said.round >= job.rounds.length) {
          run.push({ key: job.id, job: job.id, title: title(job), flag: 'Warteschlange', column: 'run', meta: id + ' · Antwort wartet auf ihre Runde' + cost });
        } else if (job.sourceQueued) {
          open.push({ key: job.id, job: job.id, title: title(job), flag: 'Antwort', column: 'open', meta: id + ' · Überarbeitung vorgesehen' + cost });
        } else if (last?.fields.decision === 'rejected') {
          open.push({ key: job.id, job: job.id, title: title(job), flag: 'Frage', column: 'open',
            meta: id + ' · Runde ' + job.rounds.length + ' abgelehnt' + (limitReached(job) ? ' · Rundenlimit' : '') + cost,
            limit: limitReached(job) });
        } else if (last?.fields.advance === 'true') {
          run.push({ key: job.id, job: job.id, title: title(job), flag: 'Warteschlange', column: 'run', meta: id + rounds + cost });
        } else if (last?.fields.decision === 'accepted') {
          decision.push({ key: job.id, job: job.id, title: title(job), flag: 'Angenommen', column: 'decision', meta: id + rounds + cost });
        }
      }
      // The stock: jobs that are not loaded in full. They are decided, however they ended.
      const loaded = new Set(data.jobs.map(job => job.id));
      for (const entry of data.index ?? []) {
        if (loaded.has(entry.id)) continue;
        decision.push({ key: entry.id, job: entry.id, title: ticketTitle(entry.title) || entry.id, archived: true, column: 'decision',
          flag: entry.decision === 'accepted' ? 'Angenommen' : entry.decision === 'rejected' ? 'Abgelehnt' : 'Ohne Runde',
          meta: entry.id.replace(/^job-/, '') + (entry.rounds ? ` · ${entry.rounds} ${entry.rounds === 1 ? 'Runde' : 'Runden'}` : '') });
      }
      return { open, run, decision };
    }

    // The tickets whose title or id contains what the user searches for.
    function filterTickets(columns, query) {
      const wanted = String(query ?? '').trim().toLowerCase();
      const match = entry => !wanted || entry.title.toLowerCase().includes(wanted) || entry.key.toLowerCase().includes(wanted);
      return { open: columns.open.filter(match), run: columns.run.filter(match), decision: columns.decision.filter(match) };
    }

    // The ticket shown before the user chose one: the first of the group that is shown.
    function firstTicket(columns, chosen) {
      return columns[boardTab(columns, chosen)][0]?.key ?? null;
    }
    /*BOARD_END*/

    /*STEPS_BEGIN*/
    // A worker that streams reports its byte count again and again. Only the last count of a run says something.
    function foldSteps(events) {
      const counted = event => /^\d+ Bytes Quellcode empfangen$/.test(event.detail);
      const folded = [];
      for (const event of events ?? []) {
        const last = folded.at(-1);
        if (counted(event) && last && counted(last) && last.kind === event.kind) {
          folded[folded.length - 1] = { ...event, folded: (last.folded ?? 1) + 1 };
        } else folded.push(event);
      }
      return folded;
    }
    /*STEPS_END*/

    /*THREAD_BEGIN*/
    // What happened in a job, in order: the messages written before each round, then the round.
    function ticketThread(job) {
      const rounds = job?.rounds ?? [];
      const messages = job?.messages ?? [];
      const told = [];
      const say = message => told.push({ kind: 'message', author: message.author, text: message.text });
      rounds.forEach((round, index) => {
        messages.filter(message => message.round === index).forEach(say);
        told.push({ kind: 'round', number: index + 1, decision: round.fields.decision, checks: round.fields.checks ?? '',
          cost: Number(round.fields.worker_cost_usd) || 0 });
      });
      messages.filter(message => message.round >= rounds.length).forEach(say);
      return told;
    }

    // One entry of the dialog of an agent session: something said, or a tool used on a target.
    function dialogLine(entry) {
      if (!entry) return null;
      if (entry.tool) return { who: entry.tool, text: entry.target ?? '', tool: true };
      return { who: entry.who === 'user' ? 'Du' : 'Agent', text: entry.text ?? '', tool: false };
    }

    // An analysis is a few lines "Label: text". Read them for display.
    function analysisLines(text) {
      return String(text ?? '').split('\n').map(line => line.trim()).filter(Boolean).map(line => {
        const at = line.indexOf(': ');
        return at > 0 && at < 24 ? [line.slice(0, at), line.slice(at + 2)] : ['', line];
      });
    }

    // Where a job stands, top down: what happened last, what the problem is, what is asked, what comes next.
    function ticketState(job) {
      const rounds = job?.rounds ?? [];
      const messages = job?.messages ?? [];
      const last = rounds.at(-1)?.fields;
      const said = messages.at(-1);
      const state = { done: 'Noch keine Runde gelaufen.', problem: '', question: '', next: 'Wartet auf die erste Runde.', analysis: [] };
      if (last?.decision === 'accepted') {
        state.done = `Runde ${rounds.length} angenommen: ${last.intent ?? ''}`.trim();
        state.next = 'Fertig. Eine Antwort von dir gibt eine weitere Runde.';
      } else if (last) {
        let kept = rounds.length - 1;
        while (kept > 0 && rounds[kept - 1].fields.decision !== 'accepted') kept -= 1;
        state.done = `Runde ${rounds.length} abgelehnt. ` + (kept ? `Der Stand aus Runde ${kept} gilt weiter.` : 'Es gibt noch keinen angenommenen Stand.');
        state.problem = last.checks || (last.worker_failure ? 'Der Agent hat nichts geliefert: ' + last.worker_failure : '') || last.feedback || '';
        state.next = 'Eine Antwort von dir gibt eine weitere Runde.';
        state.analysis = analysisLines(job.analyses?.[rounds.at(-1).name.replace(/\.run$/, '')]);
      }
      if (said?.author === 'agent') { state.question = said.text; state.next = 'Deine Antwort im Feld unten.'; }
      else if (said?.author === 'user' && said.round >= rounds.length) state.next = 'Deine Antwort wartet auf ihre Runde.';
      if (job?.sourceActive) state.next = `Der Agent arbeitet an Runde ${rounds.length + 1}.`;
      else if (last?.advance === 'true') state.next = `Runde ${rounds.length + 1} ist vorgesehen.`;
      return state;
    }

    // One line for what a round changed: the file and how many lines.
    function changeLine(change) {
      if (!change) return '';
      if (change.fresh) return `${change.file} · neu, ${change.added} ${change.added === 1 ? 'Zeile' : 'Zeilen'}`;
      if (!change.added && !change.removed) return `${change.file} · unverändert`;
      return `${change.file} · +${change.added} −${change.removed} Zeilen`;
    }
    /*THREAD_END*/

    /*CREW_BEGIN*/
    // The overview that the Factory wrote: harnesses with their sign-in state, and the defined agents.
    function crewOf(data) {
      let overview = data?.crew;
      if (typeof overview === 'string') {
        try { overview = JSON.parse(overview); } catch { overview = null; }
      }
      const usable = overview && typeof overview === 'object' && !Array.isArray(overview);
      return { harnesses: usable && Array.isArray(overview.harnesses) ? overview.harnesses : [],
        agents: usable && Array.isArray(overview.agents) ? overview.agents : [],
        checkedAt: usable ? Number(overview.checked_at) || 0 : 0 };
    }

    // The first "@name" in a text that names a usable agent. An address like a@name is not a mention.
    function mentioned(text, agents) {
      for (const match of String(text ?? '').matchAll(/(^|\s)@([a-z0-9-]{1,32})(?![a-z0-9-]*\.[a-z])/g)) {
        if (agents.some(agent => agent.name === match[2] && !agent.error)) return match[2];
      }
      return '';
    }

    function agentLine(agent) {
      return [agent.harness, agent.model || 'Standardmodell', agent.effort].filter(Boolean).join(' · ');
    }

    // Says what is wrong with a draft, or nothing when it can be saved.
    function validAgent(draft, harnesses) {
      if (!/^[a-z0-9-]{1,32}$/.test(draft.name ?? '')) return 'Der Name besteht aus Kleinbuchstaben, Ziffern und Bindestrichen, höchstens 32 Zeichen.';
      const harness = harnesses.find(entry => entry.name === draft.harness);
      if (!harness || !harness.worker) return 'Dieser Harness ist in der Factory nicht eingebunden.';
      if (!/^[A-Za-z0-9._:/-]{0,80}$/.test(draft.model ?? '')) return 'Der Modellname enthält Zeichen, die nicht erlaubt sind.';
      if (draft.effort && !(harness.efforts ?? []).includes(draft.effort)) return 'Diesen Effort bietet der Harness nicht an.';
      if ((draft.persona ?? '').length > 600) return 'Die Persona ist länger als 600 Zeichen.';
      return '';
    }
    /*CREW_END*/

    function renderCrew() {
      const crew = crewOf(snapshot);
      const wired = crew.harnesses.filter(harness => harness.worker);
      const ready = wired.filter(harness => /^(angemeldet|Schlüssel vorhanden)$/.test(harness.login));
      const usable = crew.agents.filter(agent => !agent.error);
      const harnessRow = harness => {
        const tone = /^(angemeldet|Schlüssel vorhanden)$/.test(harness.login) ? 'ready' : harness.worker ? 'off' : '';
        const billing = harness.billing === 'api' ? 'API, nach Verbrauch' : harness.billing === 'subscription' ? 'Abo' : harness.billing;
        const detail = [harness.method, billing, harness.models?.length ? `${harness.models.length} ${harness.models.length === 1 ? 'Modell' : 'Modelle'}` : '',
          harness.expires ? 'Anmeldung bis ' + String(harness.expires).slice(0, 10) : ''].filter(Boolean).join(' · ');
        return `<li class="crew-row"><span class="who">${escape(harness.name)}</span><span class="state ${tone}">${escape(harness.login)}</span>
          <span class="what" title="${escape(detail)}">${escape(detail)}</span></li>`;
      };
      const agentRow = agent => agent.error
        ? `<li class="crew-row"><span class="who">@${escape(agent.name)}</span><span class="state off">fehlerhaft</span><span class="what">${escape(agent.error)}</span></li>`
        : `<li><button type="button" class="crew-row" data-agent-edit="${escape(agent.name)}" aria-expanded="${agentDraft?.name === agent.name && !agentDraft.fresh}">
          <span class="who">@${escape(agent.name)}</span><span class="state">${escape(agent.persona ? 'mit Persona' : '')}</span>
          <span class="what">${escape(agentLine(agent))}</span></button></li>`;
      const summary = crew.harnesses.length
        ? `${usable.length} ${usable.length === 1 ? 'Agent' : 'Agenten'} · ${ready.length} von ${wired.length} Harnessen bereit` : 'Übersicht wird ermittelt';
      return `<section id="taik-crew" aria-label="Crew"><div class="section-heading"><h2>Crew</h2><span class="sub">${summary}</span></div>
        <div class="crew"><ul class="crew-list">${usable.length || crew.agents.length ? crew.agents.map(agentRow).join('') : '<li class="board-empty">Noch kein Agent. Ohne Agent arbeitet der Standard-Worker des Dienstes.</li>'}</ul>
        ${agentDraft ? agentForm(crew) : '<div class="board-tabs"><button type="button" data-agent-new>Neuer Agent</button><button type="button" data-crew-refresh>Abos neu prüfen</button></div>'}
        <details data-crew-part="harnesses"${crewHarnessesOpen ? ' open' : ''}><summary>Harnesse und Abos</summary><ul class="crew-list">${crew.harnesses.map(harnessRow).join('')}</ul></details>
        </div></section>`;
    }

    function agentForm(crew) {
      const draft = agentDraft;
      const wired = crew.harnesses.filter(harness => harness.worker);
      const harness = wired.find(entry => entry.name === draft.harness) ?? wired[0];
      const option = (value, label, chosen) => `<option value="${escape(value)}"${value === chosen ? ' selected' : ''}>${escape(label)}</option>`;
      const problem = agentProblem || '';
      return `<div class="agent-form" data-agent-form>
        <label>Name<input id="taik-agent-name" value="${escape(draft.name)}" placeholder="z. B. pruefer"${draft.fresh ? '' : ' readonly'} autocomplete="off" spellcheck="false"></label>
        <label>Harness<select id="taik-agent-harness">${wired.map(entry => option(entry.name, `${entry.name} · ${entry.login}`, harness?.name)).join('')}</select></label>
        <label>Modell<input id="taik-agent-model" value="${escape(draft.model)}" list="taik-agent-models" placeholder="Standard des Harness" autocomplete="off" spellcheck="false">
          <datalist id="taik-agent-models">${(harness?.models ?? []).map(model => `<option value="${escape(model)}">`).join('')}</datalist></label>
        <label>Effort<select id="taik-agent-effort">${option('', 'Standard', draft.effort)}${(harness?.efforts ?? []).map(effort => option(effort, effort, draft.effort)).join('')}</select></label>
        <label class="wide">Persona<textarea id="taik-agent-persona" maxlength="600" placeholder="Ein Satz, der vor jedem Auftrag steht. Optional.">${escape(draft.persona)}</textarea></label>
        ${problem ? `<p class="problem" role="alert">${escape(problem)}</p>` : ''}
        <div class="actions">${draft.fresh ? '' : `<button type="button" data-agent-delete="${escape(draft.name)}">Löschen</button>`}
          <button type="button" data-agent-cancel>Abbrechen</button><button type="button" class="save" data-agent-save>Speichern</button></div></div>`;
    }

    function renderBoard(shownKey) {
      const all = boardTickets(snapshot);
      const columns = filterTickets(all, boardSearch);
      const waiting = all.open.length;
      const tab = boardTab(columns, chosenBoardTab);
      const ticket = entry => {
        const shown = entry.key === shownKey;
        return `<li><button type="button" class="ticket${entry.column === 'open' ? ' wait' : ''}" data-ticket="${escape(entry.key)}"
          data-job="${escape(entry.job ?? '')}" aria-current="${shown}">
          <span class="ticket-head"><span class="title" title="${escape(entry.title)}">${escape(entry.title)}</span>
          <span class="flag ${entry.flag.toLowerCase().replace(/\s+/g, '-')}">${escape(entry.flag)}</span></span>
          <span class="meta">${escape(entry.proposal ? entry.proposal + ' · ' + entry.meta : entry.meta)}</span></button></li>`;
      };
      const groups = [['open', 'Wartet', 'Wartet auf Antwort', 'Nichts wartet auf dich.'], ['run', 'Läuft', 'Läuft', 'Gerade läuft nichts.'],
        ['decision', 'Entschieden', 'Entschieden', 'Noch nichts entschieden.']];
      const tabs = groups.map(([key, label]) => `<button type="button" data-board-tab="${key}"${tab === key ? ' disabled' : ''}
        class="${key === 'open' && waiting ? 'wait' : ''}">${label}<span>${columns[key].length}</span></button>`).join('');
      const lists = groups.map(([key, , label, empty]) => `<section class="board-column" id="taik-board-${key}" aria-label="${label}"${tab === key ? '' : ' hidden'}>
        <ul class="board-list">${columns[key].length ? columns[key].map(ticket).join('') : `<li class="board-empty">${empty}</li>`}</ul></section>`).join('');
      return `<section id="taik-board" aria-label="Tickets"><div class="section-heading"><h2>Tickets</h2>
        <span class="sub"><span id="taik-board-waiting">${waiting}</span> ${waiting === 1 ? 'wartet' : 'warten'} auf dich</span></div>
        <div class="board"><div class="board-tabs" role="group" aria-label="Gruppe">${tabs}
          <input id="taik-board-search" type="search" aria-label="Tickets durchsuchen" placeholder="Suchen" value="${escape(boardSearch)}"></div>${lists}</div></section>
        <section aria-label="Neues Ticket"><div class="section-heading"><h2>Neues Ticket</h2><span class="sub">in deinen Worten</span></div>
        <div class="ticket-detail new-ticket" data-detail="new">
          <textarea aria-label="Neues Ticket" placeholder="Neues Ticket: Was soll entstehen? Die erste Zeile ist der Titel.">${escape(ticketDrafts.get('new') ?? '')}</textarea>
          <div class="actions"><span class="sub" id="taik-new-ticket-note">${newTicketNote}</span>
          <button type="button" class="send" id="taik-new-ticket">Ticket anlegen</button></div></div></section>`;
    }

    function ticketDetail(entry) {
      const draft = ticketDrafts.get(entry.key) ?? '';
      const job = entry.proposal ? null : snapshot.jobs.find(candidate => candidate.id === entry.job);
      const agents = crewOf(snapshot).agents.filter(agent => !agent.error);
      const chooser = job ? `<label class="ticket-agent">Agent der nächsten Runde<select data-ticket-agent="${escape(job.id)}">
          <option value="">Standard des Dienstes</option>${agents.map(agent => `<option value="${escape(agent.name)}"${job.agent === agent.name ? ' selected' : ''}>@${escape(agent.name)} · ${escape(agentLine(agent))}</option>`).join('')}</select></label>` : '';
      return `<div class="ticket-detail" data-detail="${escape(entry.key)}">${chooser}
        <textarea aria-label="Kommentar zu ${escape(entry.key)}" placeholder="Antwort oder Frage an die Factory. Mit @name übernimmt ein Agent die nächste Runde.">${escape(draft)}</textarea>
        <div class="actions">${entry.proposal ? `<button type="button" data-proposal="${escape(entry.proposal)}">Freigeben</button>` : ''}
          <button type="button" class="send" data-ticket-send="${escape(entry.key)}">Senden</button></div></div>`;
    }

    function readiness(data) {
      if (data.service === 'offline') return ['offline', 'Factory angehalten'];
      if (data.service === 'unmanaged') return ['', 'Aufträge verfolgen'];
      if (data.pending) return ['active', data.pending === 1 ? 'Auftrag in Arbeit' : `${data.pending} offene Aufträge`];
      return ['', 'Wartet auf Auftrag'];
    }

    function operationChange(oldOrder, newOrder) {
      if (!oldOrder.length || !newOrder.length || oldOrder.join() === newOrder.join()) return '';
      const firstMismatch = newOrder.findIndex((step, index) => step !== oldOrder[index]);
      const nextStep = newOrder[firstMismatch];
      const movedFrom = oldOrder.indexOf(nextStep);
      if (movedFrom > firstMismatch) return `${labels[nextStep] ?? nextStep} vor ${labels[oldOrder[firstMismatch]] ?? oldOrder[firstMismatch]}`;
      return 'Reihenfolge geändert';
    }

    function measure(text, key) {
      return Number((text ?? '').match(new RegExp(`(?:^|, )${key}:(\\d+)(?:,|$)`))?.[1] ?? NaN);
    }

    function comparison(job, accepted) {
      const first = job.rounds.find(round => round.fields.baseline_work)?.fields.baseline_work;
      const current = accepted.fields.probe_work;
      if (!first || !current) return '';
      const measures = [['lowercase_bytes', 'Bytes vor Kleinschreibung'], ['sort_items', 'Elemente beim Sortieren']];
      const groups = measures.map(([key, label]) => {
        const before = measure(first, key);
        const after = measure(current, key);
        if (!Number.isFinite(before) || !Number.isFinite(after)) return '';
        const max = Math.max(before, after, 1);
        return `<div class="measure" role="img" aria-label="${label}: vorher ${before}, jetzt ${after}">
          <h3>${label}</h3><p class="sub">Vorher ${before} · Jetzt ${after}</p>
          <div class="metric-bars" aria-hidden="true">
            <div class="metric-track"><span class="metric-bar before" style="width:${before / max * 100}%"></span></div>
            <div class="metric-track"><span class="metric-bar" style="width:${after / max * 100}%"></span></div>
          </div></div>`;
      }).join('');
      return groups ? `<section aria-label="Gemessene Änderung"><h2>Aufwand im Prüflauf</h2><div class="measures">${groups}</div></section>` : '';
    }

    // What the agent said and did in the round, in order.
    function roundDialog(job, round, name) {
      const entries = (job.dialogs?.[round.name.replace(/\.run$/, '')] ?? []).map(dialogLine).filter(Boolean);
      if (!entries.length) return '';
      const key = `${name}/dialog`;
      const open = openRounds.get(key) ?? false;
      return `<details class="round-dialog" data-round="${escape(key)}" data-initial-open="${open}"${open ? ' open' : ''}>
        <summary>Dialog (${entries.length})</summary><ol>${entries.map(entry => entry.tool
          ? `<li class="tool"><span class="who">${escape(entry.who)}</span><code>${escape(entry.text)}</code></li>`
          : `<li><span class="who">${escape(entry.who)}</span>${escape(entry.text)}</li>`).join('')}</ol></details>`;
    }

    // What the round changed: one line, and the changed lines behind it.
    function roundChange(job, round, name) {
      const change = job.changes?.[round.name.replace(/\.run$/, '')];
      if (!change) return '';
      const key = `${name}/change`;
      const open = openRounds.get(key) ?? false;
      const label = (change.rejected ? 'Abgelehnter Kandidat: ' : 'Geändert: ') + changeLine(change);
      if (!change.lines?.length) return `<p class="round-change">${escape(label)}</p>`;
      const lines = change.lines.map(line => line === '···' ? '<span class="diff-gap">···</span>'
        : `<span class="diff-${line[0] === '+' ? 'add' : line[0] === '-' ? 'del' : 'same'}">${escape(line)}</span>`).join('\n');
      return `<details class="round-change" data-round="${escape(key)}" data-initial-open="${open}"${open ? ' open' : ''}>
        <summary>${escape(label)}</summary><pre class="diff">${lines}${change.more ? `\n<span class="diff-gap">··· ${change.more} weitere Zeilen</span>` : ''}</pre></details>`;
    }

    function renderRound(round, index, job, flow) {
      const fields = round.fields;
      const rejected = fields.decision === 'rejected';
      const name = `${job.id}/${round.name}`;
      const events = job.progress?.[round.name.replace(/\.run$/, '')] ?? [];
      const latest = index === job.rounds.length - 1;
      const eventKey = `${name}/events`;
      const eventsOpen = openRounds.get(eventKey) ?? latest;
      const checksOpen = openRounds.get(name) ?? (latest && !events.length);
      const changed = operationChange(order(fields.baseline_procedure), order(fields.procedure));
      const software = fields.kind === 'software';
      const search = fields.kind === 'search';
      const changedPolicy = search && fields.policy !== fields.baseline_policy;
      const applied = changedPolicy || fields.advance === 'true';
      const decision = rejected ? 'Kandidat abgelehnt' : software ? 'Quellcode angenommen' : applied ? 'Änderung übernommen' : 'Prozedur beibehalten';
      const description = search ? searchPolicies[fields.policy] ?? fields.intent : software ? fields.intent : changed || (rejected ? 'Der letzte akzeptierte Stand bleibt gültig.' : 'Keine weitere einzelne Umstellung verbessert den geprüften Aufwand.');
      return `<li class="round${rejected ? ' rejected' : ''}"><div class="rail" aria-hidden="true"><span class="node"></span><span class="groove"></span></div>
        <div class="round-body"><div class="round-meta"><span class="index">Runde ${String(index + 1).padStart(2, '0')}</span>
        <span class="result${rejected ? ' rejected' : ''}">${decision}${fields.worker_cost_usd ? ' · ' + money(fields.worker_cost_usd) : ''}</span></div>
        ${flow && flow.input + flow.output > 0 ? `<div class="token-flow" title="${escape(round.name)}"><span class="in" style="width:${flow.widthIn}%"></span><span class="out" style="width:${flow.widthOut}%"></span></div>
        <p class="sub">${tokenLine(flow)}</p>` : ''}
        <h3>${escape(ticketTitle(description))}</h3>
        ${fields.checks ? `<p class="round-checks">${escape(fields.checks)}</p>` : ''}
        ${rejected && !latest ? analysisLines(job.analyses?.[round.name.replace(/\.run$/, '')]).map(([label, text]) =>
          `<p class="round-checks analysis">${label ? `<strong>${escape(label)}:</strong> ` : ''}${escape(text)}</p>`).join('') : ''}
        ${fields.summary ? `<p class="round-summary">${escape(fields.summary)}</p>` : ''}
        ${roundChange(job, round, name)}
        ${roundDialog(job, round, name)}
        ${events.length ? `<details data-round="${escape(eventKey)}" data-initial-open="${eventsOpen}"${eventsOpen ? ' open' : ''}>
          <summary>Arbeitsschritte (${events.length})</summary>${eventList(events)}</details>` : ''}
        <details data-round="${escape(name)}" data-initial-open="${checksOpen}"${checksOpen ? ' open' : ''}>
          <summary>Prüfprotokoll</summary><pre class="run-record">${highlightRun(round.detail)}</pre>
        </details>
      </div></li>`;
    }

    function eventList(events) {
      return `<ol class="events">${foldSteps(events).map(event => {
        const elapsed = event.elapsed >= 1000000 ? `${(event.elapsed / 1000000).toFixed(1)} s`
          : event.elapsed >= 1000 ? `${(event.elapsed / 1000).toFixed(1)} ms` : `${event.elapsed} µs`;
        const name = Object.hasOwn(eventLabels, event.kind) ? eventLabels[event.kind] : event.kind;
        return `<li><time>${elapsed}</time><div><span class="event-name">${escape(name)}</span><code>${escape(event.detail)}${event.folded ? ` · ${event.folded} Meldungen` : ''}</code></div></li>`;
      }).join('')}</ol>`;
    }

    function progressPanel(job) {
      const index = job.rounds.length + (isPending(job) ? 1 : 0);
      if (index < 1) return '';
      const key = `round-${String(index).padStart(2, '0')}`;
      const events = job.progress?.[key] ?? [];
      if (!events.length && !isPending(job)) return '';
      const title = job.sourceQueued ? 'Auftrag eingereiht' : isPending(job) ? `Runde ${index} · Live` : `Letzte Runde · ${index}`;
      const recent = events.length ? eventList(events.slice(-4)) : '<p class="sub lead">Die Runde wartet auf ihren Start.</p>';
      const last = events.at(-1)?.kind;
      const phase = last === 'evaluate' || last === 'checks' ? 'Factory prüft den Code' : 'Code-Worker arbeitet';
      const running = job.sourceActive ? `<p class="running">${phase} <span data-started="${Number(job.sourceStartedAt) || 0}"></span></p>` : '';
      return `<section aria-label="Arbeitsschritte"><h2>${title}</h2>${running}${recent}</section>`;
    }

    const searchPolicies = {
      all: 'Alle Umstellungen',
      unique: 'Jede Umstellung einmal',
      'valid-unique': 'Nur gültige Umstellungen, jeweils einmal',
      precomputed: 'Vorausberechnete Suchentscheidungen'
    };

    function render() {
      if (!snapshot) return;
      const [tone, status] = readiness(snapshot);
      const appearanceOptions = Object.entries(appearances).map(([value, label]) =>
        `<option value="${value}"${appearance === value ? ' selected' : ''}>${label}</option>`).join('');
      setHeader(`<h1><svg class="mark" viewBox="0 0 64 64" aria-hidden="true"><path d="M26.22 14.55A17.35 17.35 0 1 1 18.13 43.58A15.72 15.72 0 1 0 26.22 14.55Z M16.43 31.11A10.96 10.96 0 1 1 36.03 35.93A10.1 10.1 0 1 0 16.43 31.11Z M22.27 37.25A6.47 6.47 0 1 1 32.15 29.67A7.04 7.04 0 0 0 22.27 37.25Z"/><path class="core" d="M26.6 39.95A4.95 4.95 0 1 1 34.1 34.52A5.32 5.32 0 0 0 26.6 39.95Z"/></svg>TAIK <span>Factory</span></h1><div class="header-controls">
        <div class="status" role="status"><span class="dot ${tone}" aria-hidden="true"></span>${status}</div>
        ${Number.isFinite(snapshot.spent) ? `<div class="status" title="Worker-Kosten der letzten 24 Stunden zum Listenpreis">24 h · ${snapshot.spent.toFixed(2).replace('.', ',')} $</div>` : ''}
        ${Number.isFinite(snapshot.parallel) ? `<label class="appearance" title="Wie viele Software-Aufträge der Dienst gleichzeitig bearbeitet">Parallel <select id="taik-parallel">${[1, 2, 3, 4, 5, 6, 7, 8].map(slots =>
          `<option value="${slots}"${snapshot.parallel === slots ? ' selected' : ''}>${slots}</option>`).join('')}</select></label>` : ''}
        <label class="appearance">Darstellung <select id="taik-appearance">${appearanceOptions}</select></label>
      </div>`);
      // Before the user chose: the job at work, otherwise the first ticket of the group that is shown.
      const first = selected === 'latest' && !selectedProposal && !snapshot.jobs.some(job => job.sourceActive)
        ? firstTicket(boardTickets(snapshot), chosenBoardTab) : null;
      const job = snapshot.jobs.find(job => job.id === (first ?? selected))
        ?? snapshot.jobs.find(job => job.sourceActive) ?? snapshot.jobs[0];
      if (!job) {
        renderPreview();
        setContent(`${renderBoard('')}<section><h2>Aufträge</h2><p class="sub lead">Hier erscheinen die Aufträge, sobald die Factory sie annimmt.</p></section>`);
        return;
      }
      const proposal = (snapshot.proposals ?? []).find(entry => entry.name === (selectedProposal || (first?.startsWith('proposal:') ? first.slice(9) : '')));
      if (!proposal) selectedProposal = '';
      const awaited = !proposal && selected !== 'latest' && job.id !== selected ? (snapshot.index ?? []).find(entry => entry.id === selected) : null;
      const board = renderBoard(proposal ? 'proposal:' + proposal.name : awaited ? awaited.id : job.id);
      const waitingNow = boardTickets(snapshot).open.length;
      if (waitingBefore !== null && waitingNow > waitingBefore) window.webkit?.messageHandlers?.attention?.postMessage(waitingNow);
      waitingBefore = waitingNow;
      const agentState = agent => agent.event === 'Stop' ? ['', 'wartet']
        : agent.event === 'UserPromptSubmit' ? ['active', 'liest den Auftrag']
        : agent.event === 'PreToolUse' ? ['active', agent.tool] : ['', `${agent.tool} beendet`];
      const agents = (snapshot.agents ?? []).map(agent => {
        const [tone, doing] = agentState(agent);
        const where = agent.target ? agent.target.split('/').slice(-2).join('/') : agent.cwd.split('/').at(-1);
        return `<li><span class="dot ${tone}" aria-hidden="true"></span><div><h3>Claude Code <span class="sub">${escape(agent.session.slice(0, 8))}</span></h3>
          <span class="sub" title="${escape(agent.target)}">${escape(doing)}${where ? ' · ' + escape(where) : ''}</span></div>
          <time class="sub" data-at="${Number(agent.at) || 0}"></time></li>`;
      }).join('');
      const working = agents ? `<section aria-label="Sitzungen"><div class="section-heading"><h2>Sitzungen</h2>
          <span class="sub">gemeldet über Hooks, ohne Modellaufruf</span></div><ul class="agents">${agents}</ul></section>` : '';
      const accepted = latestAccepted(job);
      renderPreview(job);
      const initialOrder = order(job.baseline.fields.procedure);
      const currentOrder = order(accepted.fields.procedure);
      const steps = currentOrder.map((operation, index) => `<li${initialOrder[index] !== operation ? ' class="changed"' : ''}>${escape(labels[operation] ?? operation)}</li>`).join('');
      const tags = (accepted.fields.tags || '').split(',').filter(Boolean).map(tag => `<code>${escape(tag)}</code>`).join('');
      const artifact = accepted.fields.artifact;
      const software = job.baseline.fields.kind === 'software';
      const search = job.baseline.fields.kind === 'search';
      const policy = escape(searchPolicies[accepted.fields.policy ?? accepted.fields.procedure]);
      const artifactButton = software && artifact
        ? `<button type="button" data-artifact="${escape(artifact)}" data-job="${escape(job.id)}">${artifact.endsWith('-taik-seed') ? 'Im Finder zeigen' : 'Ergebnis öffnen'}</button>` : '';
      const results = software ? '' : search ? `<section><h2>Akzeptierte Suchprozedur</h2><p class="lead">${policy}</p></section>` : `<section><h2>Akzeptierte Prozedur</h2><ol class="steps">${steps}</ol>
        <div class="tags"><span class="sub">Ergebnis</span>${tags || '<span class="sub">Leere Tag-Liste</span>'}</div></section>`;
      const flows = tokenFlow(job.rounds.map(round => round.fields));
      const tokenTotals = flows.reduce((sum, entry) => ({ input: sum.input + entry.input, output: sum.output + entry.output, seconds: sum.seconds + entry.seconds }), { input: 0, output: 0, seconds: 0 });
      const totalsLine = tokenTotals.input + tokenTotals.output > 0
        ? `<p class="sub">Gesamt ${tokenCount(tokenTotals.input)} → ${tokenCount(tokenTotals.output)} Tokens · ${secondsText(tokenTotals.seconds)} · ${job.rounds.length} ${job.rounds.length === 1 ? 'Runde' : 'Runden'}</p>` : '';
      const told = ticketThread(job).map(item => item.kind === 'round'
        ? renderRound(job.rounds[item.number - 1], item.number - 1, job, flows[item.number - 1])
        : `<li class="thread-message ${item.author === 'user' ? 'user' : 'agent'}"><span class="who">${item.author === 'user' ? 'Du' : 'Agent'}</span>${escape(item.text)}</li>`).join('');
      const stateBlock = state => `<dl class="ticket-state"><div><dt>Stand</dt><dd>${escape(state.done)}</dd></div>
          ${state.problem ? `<div class="problem"><dt>Problem</dt><dd>${escape(state.problem)}</dd></div>` : ''}
          ${state.analysis.map(([label, text]) => `<div class="analysis"><dt>${escape(label || 'Analyse')}</dt><dd>${escape(text)}</dd></div>`).join('')}
          ${state.question ? `<div class="question"><dt>Offene Frage</dt><dd>${escape(state.question)}</dd></div>` : ''}
          <div><dt>Als Nächstes</dt><dd>${escape(state.next)}</dd></div></dl>`;
      const briefKey = `${job.id}/brief`;
      const briefOpen = openRounds.get(briefKey) ?? true;
      const proposalState = { deriving: 'Die Factory leitet Auftrag und Gate ab', declined: 'Die Factory hat daraus keinen Auftrag abgeleitet', failed: 'Das Ableiten ist fehlgeschlagen' };
      const proposalKey = proposal ? `proposal:${proposal.name}/brief` : '';
      const proposalOpen = openRounds.get(proposalKey) ?? true;
      const ticketOpen = '<section id="taik-ticket" aria-label="Ticket"';
      const ticket = proposal
        ? `${ticketOpen} data-proposal="${escape(proposal.name)}">
          <div class="section-heading"><h2>Ticket</h2><span class="sub">${escape(proposal.name)} · ${proposal.state ? proposalState[proposal.state] ?? escape(proposal.state) : 'Vorschlag der Factory, wartet auf deine Freigabe'}</span></div>
          <div class="ticket-top"><h3 class="ticket-title">${escape(ticketTitle(proposal.intent))}</h3></div>
          ${proposal.note ? `<p class="round-checks">${escape(proposal.note)}</p>` : ''}
          ${proposal.brief ? `<details class="ticket-brief" data-round="${escape(proposalKey)}" data-initial-open="${proposalOpen}"${proposalOpen ? ' open' : ''}><summary>Beschreibung</summary><pre>${escape(proposal.brief)}</pre></details>` : ''}
          <div class="thread" aria-label="Auftragsverlauf">${(proposal.messages ?? []).length ? `<ol class="rounds">${proposal.messages.map(item =>
            `<li class="thread-message ${item.author === 'user' ? 'user' : 'agent'}"><span class="who">${item.author === 'user' ? 'Du' : 'Agent'}</span>${escape(item.text)}</li>`).join('')}</ol>` : ''}</div>
          ${proposal.state ? '' : ticketDetail({ key: 'proposal:' + proposal.name, proposal: proposal.name })}</section>`
        : `${ticketOpen} data-job="${escape(job.id)}">
          <div class="section-heading"><h2>Ticket</h2><span class="sub">${escape(job.id)} · ${jobStatus(job)}${job.agent ? ' · @' + escape(job.agent) : ''}${job.cost > 0 ? ' · ' + money(job.cost) : ''}</span></div>
          <div class="ticket-top"><h3 class="ticket-title">${escape(ticketTitle(job.goal) || job.id)}</h3>${artifactButton}</div>
          ${stateBlock(ticketState(job))}
          ${job.brief ? `<details class="ticket-brief" data-round="${escape(briefKey)}" data-initial-open="${briefOpen}"${briefOpen ? ' open' : ''}><summary>Beschreibung</summary><pre>${escape(job.brief)}</pre></details>` : ''}
          <div class="thread" aria-label="Auftragsverlauf">${totalsLine}
          ${told ? `<ol class="rounds">${told}</ol>` : '<p class="sub lead">Die Factory hat den Auftrag erhalten. Die erste Runde steht noch aus.</p>'}</div>
          ${isPending(job) ? progressPanel(job) : ''}
          ${ticketDetail({ key: job.id, job: job.id })}</section>`;
      const shownTicket = awaited ? `${ticketOpen} data-job="${escape(awaited.id)}">
          <div class="section-heading"><h2>Ticket</h2><span class="sub">${escape(awaited.id)} · wird geladen</span></div>
          <div class="ticket-top"><h3 class="ticket-title">${escape(ticketTitle(awaited.title) || awaited.id)}</h3></div></section>` : ticket;
      setContent(`${board}${shownTicket}${renderCrew()}${working}${results}${comparison(job, accepted)}`);
    }

    function setHeader(html) {
      if (html === lastHeader) return;
      lastHeader = html;
      const focused = ['taik-appearance', 'taik-parallel'].find(id => document.activeElement?.id === id);
      header.innerHTML = html;
      if (focused) document.getElementById(focused)?.focus({ preventScroll: true });
    }

    function setContent(html) {
      if (html === lastHTML) return;
      lastHTML = html;
      const focusId = document.activeElement?.id;
      const kept = focusId?.startsWith('taik-agent-') || focusId === 'taik-board-search';
      const fieldCaret = kept && document.activeElement.setSelectionRange
        ? [document.activeElement.selectionStart, document.activeElement.selectionEnd] : null;
      // A reply is typed while the snapshot refreshes. Keep its field and caret.
      const typing = document.activeElement?.closest?.('.ticket-detail')?.dataset.detail ? document.activeElement : null;
      const caret = typing ? [typing.selectionStart, typing.selectionEnd] : null;
      const offsets = new Map([...activity.querySelectorAll('details[open][data-round] > :not(summary)')]
        .map(element => [element.parentElement.dataset.round, element.scrollTop]));
      activity.innerHTML = html;
      for (const element of activity.querySelectorAll('details[open][data-round] > :not(summary)')) {
        element.scrollTop = offsets.get(element.parentElement.dataset.round) ?? 0;
      }
      updateElapsed();
      if (kept) {
        const again = document.getElementById(focusId);
        again?.focus({ preventScroll: true });
        if (again && fieldCaret && again.setSelectionRange) again.setSelectionRange(fieldCaret[0], fieldCaret[1]);
      }
      if (typing) {
        const again = document.querySelector(`.ticket-detail[data-detail="${CSS.escape(typing.closest('.ticket-detail').dataset.detail)}"] textarea`);
        again?.focus({ preventScroll: true });
        if (again && caret) again.setSelectionRange(caret[0], caret[1]);
      }
    }

    function updateAges() {
      for (const label of root.querySelectorAll('time[data-at]')) {
        const seconds = Math.max(0, Math.floor(Date.now() / 1000 - Number(label.dataset.at)));
        label.textContent = seconds < 60 ? `vor ${seconds} s` : `vor ${Math.floor(seconds / 60)} min`;
      }
    }

    function updateElapsed() {
      updateAges();
      for (const label of root.querySelectorAll('[data-started]')) {
        const start = Number(label.dataset.started);
        if (!start) continue;
        const seconds = Math.max(0, Math.floor(Date.now() / 1000 - start));
        label.textContent = `· ${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, '0')}`;
      }
    }

    window.setInterval(updateElapsed, 1000);

    root.addEventListener('change', event => {
      if (event.target.id === 'taik-appearance' && Object.hasOwn(appearances, event.target.value)) {
        appearance = event.target.value;
        document.documentElement.dataset.appearance = appearance;
        syncAppearance();
        window.webkit?.messageHandlers?.setAppearance?.postMessage(appearance);
        return;
      }
      if (event.target.id === 'taik-agent-harness' && agentDraft) {
        agentDraft.harness = event.target.value;
        agentDraft.model = '';
        agentDraft.effort = '';
        render();
        return;
      }
      if (event.target.id === 'taik-agent-effort' && agentDraft) { agentDraft.effort = event.target.value; return; }
      if (event.target.dataset?.ticketAgent) {
        window.webkit?.messageHandlers?.setJobAgent?.postMessage({ job: event.target.dataset.ticketAgent, agent: event.target.value });
        return;
      }
      if (event.target.id === 'taik-parallel') {
        window.webkit?.messageHandlers?.setParallel?.postMessage(Number(event.target.value));
        return;
      }
    });
    root.addEventListener('click', event => {
      const modeButton = event.target.closest('button[data-workpiece-mode]');
      if (modeButton) {
        workpieceMode = modeButton.dataset.workpieceMode;
        render();
        return;
      }
      const approve = event.target.closest('button[data-proposal]');
      if (approve) {
        approve.disabled = true;
        approve.textContent = 'Eingereiht';
        window.webkit?.messageHandlers?.approveProposal?.postMessage(approve.dataset.proposal);
        return;
      }
      if (event.target.closest('button[data-crew-refresh]')) {
        event.target.closest('button').disabled = true;
        window.webkit?.messageHandlers?.refreshCrew?.postMessage('');
        return;
      }
      if (event.target.closest('button[data-agent-new]')) {
        const first = crewOf(snapshot).harnesses.find(harness => harness.worker);
        agentDraft = { name: '', harness: first?.name ?? '', model: '', effort: '', persona: '', fresh: true };
        agentProblem = '';
        render();
        document.getElementById('taik-agent-name')?.focus();
        return;
      }
      const editAgent = event.target.closest('button[data-agent-edit]');
      if (editAgent) {
        const agent = crewOf(snapshot).agents.find(entry => entry.name === editAgent.dataset.agentEdit);
        agentDraft = agentDraft?.name === agent?.name && !agentDraft.fresh ? null : agent ? { ...agent, fresh: false } : null;
        agentProblem = '';
        render();
        return;
      }
      if (event.target.closest('button[data-agent-cancel]')) { agentDraft = null; agentProblem = ''; render(); return; }
      if (event.target.closest('button[data-agent-save]') && agentDraft) {
        const crew = crewOf(snapshot);
        agentProblem = validAgent(agentDraft, crew.harnesses)
          || (agentDraft.fresh && crew.agents.some(agent => agent.name === agentDraft.name) ? 'Diesen Namen gibt es schon.' : '');
        if (!agentProblem) {
          const { name, harness, model, effort, persona } = agentDraft;
          window.webkit?.messageHandlers?.saveAgent?.postMessage({ name, harness, model, effort, persona });
          agentDraft = null;
        }
        render();
        return;
      }
      const removeAgent = event.target.closest('button[data-agent-delete]');
      if (removeAgent) {
        window.webkit?.messageHandlers?.deleteAgent?.postMessage(removeAgent.dataset.agentDelete);
        agentDraft = null;
        render();
        return;
      }
      const boardTabButton = event.target.closest('button[data-board-tab]');
      if (boardTabButton) {
        chosenBoardTab = boardTabButton.dataset.boardTab;
        render();
        document.querySelector(`button[data-board-tab="${chosenBoardTab}"]`)?.focus();
        return;
      }
      if (event.target.closest('#taik-new-ticket')) {
        const field = document.querySelector('.new-ticket textarea');
        const text = field?.value.trim() ?? '';
        if (!text) { field?.focus(); return; }
        window.webkit?.messageHandlers?.newTicket?.postMessage({ text });
        ticketDrafts.delete('new');
        newTicketNote = 'Angelegt. Die Factory leitet daraus einen Vorschlag ab.';
        chosenBoardTab = 'run';
        render();
        return;
      }
      const send = event.target.closest('button[data-ticket-send]');
      if (send) {
        const key = send.dataset.ticketSend;
        const field = send.closest('.ticket-detail')?.querySelector('textarea');
        const text = field?.value.trim() ?? '';
        if (!text) { field?.focus(); return; }
        send.disabled = true;
        send.textContent = 'Gesendet';
        window.webkit?.messageHandlers?.commentTicket?.postMessage({ name: key.replace(/^proposal:/, ''), text });
        ticketDrafts.delete(key);
        // "@name" in a reply hands the next round of this job to that agent.
        const handed = mentioned(text, crewOf(snapshot).agents);
        if (handed && key.startsWith('job-')) window.webkit?.messageHandlers?.setJobAgent?.postMessage({ job: key, agent: handed });
        return;
      }
      const ticketButton = event.target.closest('button[data-ticket]');
      if (ticketButton) {
        const key = ticketButton.dataset.ticket;
        selectedProposal = key.startsWith('proposal:') ? key.slice('proposal:'.length) : '';
        if (!selectedProposal) {
          selected = key;
          if (!snapshot.jobs.some(job => job.id === key)) window.webkit?.messageHandlers?.showJob?.postMessage(key);
        }
        render();
        document.querySelector(`button[data-ticket="${CSS.escape(key)}"]`)?.focus();
        return;
      }
      const button = event.target.closest('button[data-artifact]');
      if (button) window.webkit?.messageHandlers?.openArtifact?.postMessage({job:button.dataset.job,name:button.dataset.artifact});
    });
    root.addEventListener('input', event => {
      const part = { 'taik-agent-name': 'name', 'taik-agent-model': 'model', 'taik-agent-persona': 'persona' }[event.target.id];
      if (part && agentDraft) { agentDraft[part] = event.target.value; return; }
      if (event.target.id === 'taik-board-search') { boardSearch = event.target.value; render(); return; }
      const field = event.target.closest('.ticket-detail textarea');
      const key = field?.closest('.ticket-detail')?.dataset.detail;
      if (key) ticketDrafts.set(key, field.value);
    });
    root.addEventListener('toggle', event => {
      if (event.target.dataset?.crewPart === 'harnesses') { crewHarnessesOpen = event.target.open; return; }
      const id = event.target.dataset?.round;
      if (!id || !event.target.isConnected || event.target.dataset.initialOpen === String(event.target.open)) return;
      openRounds.set(id, event.target.open);
      event.target.dataset.initialOpen = String(event.target.open);
      lastHTML = activity.innerHTML;
    }, true);
    window.updateFactory = data => {
      if (!data) return;
      snapshot = data;
      if (selected !== 'latest' && !snapshot.jobs.some(job => job.id === selected)
        && !(snapshot.index ?? []).some(entry => entry.id === selected)) selected = 'latest';
      render();
    };
    window.updateFactory(/*FACTORY_DATA*/null);
  })();
</script>
