<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teig</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f5f0;
    --fg: #2b2a27;
    --muted: #6b675e;
    --card: #ffffff;
    --line: #e2ddd2;
    --accent: #8a5a2b;
    --warn-bg: #fbeaea;
    --warn-fg: #8b2020;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1b19;
      --fg: #ebe7df;
      --muted: #a39d92;
      --card: #262522;
      --line: #3a3833;
      --accent: #d9a46a;
      --warn-bg: #3a2222;
      --warn-fg: #f0a8a8;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 17px;
    line-height: 1.5;
  }
  main {
    max-width: 34rem;
    margin: 0 auto;
    padding: 2rem 1.25rem 3rem;
  }
  h1 {
    font-size: 1.6rem;
    font-weight: 600;
    margin: 0 0 1.5rem;
    color: var(--accent);
  }
  h2 {
    font-size: 1.05rem;
    font-weight: 600;
    margin: 0 0 0.75rem;
    color: var(--muted);
  }
  section {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 1.25rem;
    margin-bottom: 1.25rem;
  }
  .feld {
    display: grid;
    grid-template-columns: 1fr 7.5rem;
    align-items: center;
    gap: 0.75rem;
    padding: 0.4rem 0;
  }
  label { color: var(--fg); }
  .einheit { color: var(--muted); font-size: 0.9em; }
  input[type="number"] {
    width: 100%;
    font: inherit;
    padding: 0.4rem 0.5rem;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--bg);
    color: var(--fg);
    text-align: right;
  }
  input[type="number"]:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  dl { margin: 0; }
  .zeile {
    display: flex;
    justify-content: space-between;
    gap: 1rem;
    padding: 0.45rem 0;
    border-bottom: 1px solid var(--line);
  }
  .zeile:last-child { border-bottom: none; }
  .zeile.unter dt { padding-left: 1rem; color: var(--muted); }
  .zeile.unter dd { color: var(--muted); }
  .zeile.summe dt, .zeile.summe dd { font-weight: 600; }
  dt { margin: 0; }
  dd { margin: 0; font-variant-numeric: tabular-nums; text-align: right; }
  .hinweis {
    color: var(--warn-fg);
    background: var(--warn-bg);
    padding: 0.1rem 0.5rem;
    border-radius: 4px;
    font-size: 0.92em;
  }
</style>
</head>
<body>
<main>
  <h1>Teig</h1>

  <section>
    <h2>Eingaben</h2>
    <div class="feld">
      <label for="mehl">Gesamtmehl <span class="einheit">(g, inkl. Sauerteig)</span></label>
      <input type="number" id="mehl" value="500" min="0" step="1">
    </div>
    <div class="feld">
      <label for="hydration">Hydration <span class="einheit">(%)</span></label>
      <input type="number" id="hydration" value="70" min="0" step="1">
    </div>
    <div class="feld">
      <label for="salz">Salz <span class="einheit">(% vom Mehl)</span></label>
      <input type="number" id="salz" value="2" min="0" step="0.1">
    </div>
    <div class="feld">
      <label for="sauerteig">Sauerteig <span class="einheit">(% vom Mehl)</span></label>
      <input type="number" id="sauerteig" value="20" min="0" step="1">
    </div>
    <div class="feld">
      <label for="sauerteigHydration">Hydration Sauerteig <span class="einheit">(%)</span></label>
      <input type="number" id="sauerteigHydration" value="100" min="0" step="1">
    </div>
  </section>

  <section aria-live="polite">
    <h2>Rezept</h2>
    <dl>
      <div class="zeile"><dt>Sauerteig</dt><dd id="out-sauerteig"></dd></div>
      <div class="zeile unter"><dt>davon Mehl</dt><dd id="out-sauerteigMehl"></dd></div>
      <div class="zeile unter"><dt>davon Wasser</dt><dd id="out-sauerteigWasser"></dd></div>
      <div class="zeile"><dt>Mehl dazu</dt><dd id="out-mehlDazu"></dd></div>
      <div class="zeile"><dt>Wasser dazu</dt><dd id="out-wasserDazu"></dd></div>
      <div class="zeile"><dt>Salz</dt><dd id="out-salz"></dd></div>
      <div class="zeile summe"><dt>Teiggewicht gesamt</dt><dd id="out-gesamt"></dd></div>
    </dl>
  </section>
</main>

<script>
/*TEIG_BEGIN*/
function teig({ mehl, hydration, salz, sauerteig, sauerteigHydration }) {
  var S = mehl * sauerteig / 100;
  var sauerteigMehl = S / (1 + sauerteigHydration / 100);
  var sauerteigWasser = S - sauerteigMehl;
  var mehlDazu = mehl - sauerteigMehl;
  var gesamtWasser = mehl * hydration / 100;
  var wasserDazu = gesamtWasser - sauerteigWasser;
  var salzG = mehl * salz / 100;
  var gesamt = mehl + gesamtWasser + salzG;
  var moeglich = mehlDazu >= 0 && wasserDazu >= 0;
  return {
    sauerteig: Math.round(S),
    sauerteigMehl: Math.round(sauerteigMehl),
    sauerteigWasser: Math.round(sauerteigWasser),
    mehlDazu: Math.round(mehlDazu),
    wasserDazu: Math.round(wasserDazu),
    salz: Math.round(salzG),
    gesamt: Math.round(gesamt),
    moeglich: moeglich
  };
}
/*TEIG_END*/

(function () {
  var ids = ["mehl", "hydration", "salz", "sauerteig", "sauerteigHydration"];
  var HINWEIS = "Rezeptur geht so nicht auf";

  function wert(id) {
    var v = parseFloat(document.getElementById(id).value);
    return isFinite(v) ? v : 0;
  }

  function setze(id, text, warn) {
    var el = document.getElementById("out-" + id);
    el.textContent = "";
    if (warn) {
      var s = document.createElement("span");
      s.className = "hinweis";
      s.textContent = text;
      el.appendChild(s);
    } else {
      el.textContent = text;
    }
  }

  function g(n) {
    return (Object.is(n, -0) ? 0 : n) + " g";
  }

  function aktualisiere() {
    var e = {};
    ids.forEach(function (id) { e[id] = wert(id); });
    var r = teig(e);
    var genau = e.mehl * e.sauerteig / 100;
    var stMehl = genau / (1 + e.sauerteigHydration / 100);
    var mehlNeg = (e.mehl - stMehl) < 0;
    var wasserNeg = (e.mehl * e.hydration / 100 - (genau - stMehl)) < 0;

    setze("sauerteig", g(r.sauerteig));
    setze("sauerteigMehl", g(r.sauerteigMehl));
    setze("sauerteigWasser", g(r.sauerteigWasser));
    setze("mehlDazu", mehlNeg ? HINWEIS : g(r.mehlDazu), mehlNeg);
    setze("wasserDazu", wasserNeg ? HINWEIS : g(r.wasserDazu), wasserNeg);
    setze("salz", g(r.salz));
    setze("gesamt", g(r.gesamt));
  }

  ids.forEach(function (id) {
    var el = document.getElementById(id);
    el.addEventListener("input", aktualisiere);
    el.addEventListener("change", aktualisiere);
  });
  aktualisiere();
})();
</script>
</body>
</html>
